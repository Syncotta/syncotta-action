name: Question
description: Ask about setup, configuration or how something works.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The [troubleshooting guide](https://syncotta.com/docs/troubleshooting/) answers the most common questions.
        This tracker is public: leave out secrets and your Jira site URL.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Your setup
      description: Argo CD version, how you installed the chart, which docs page you followed.
